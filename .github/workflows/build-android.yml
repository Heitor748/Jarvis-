name: Build Android APK

on:
  push:
    branches: [claude/jarvis-voice-assistant-Svm3h, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          mkdir -p ~/.gradle/init.d
          cp scripts/gradle-init.gradle ~/.gradle/init.d/compose-compat.gradle

      - name: Show generated build files
        run: |
          echo "=== android/build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle
          echo ""
          echo "=== android/gradle.properties ==="
          cat android/gradle.properties

      - name: Build APK debug
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
