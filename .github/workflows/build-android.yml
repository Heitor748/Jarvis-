name: Build Android APK

on:
  push:
    branches: [claude/jarvis-voice-assistant-Svm3h, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Fix Kotlin version (compatibilidade)
        run: |
          sed -i 's/kotlinVersion = "[^"]*"/kotlinVersion = "1.9.24"/' android/build.gradle || true
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "kotlin.version=1.9.24" >> android/gradle.properties

      - name: Build APK debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK ⬇️
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
