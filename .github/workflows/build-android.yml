name: Build Android APK

on:
  push:
    branches: [claude/jarvis-voice-assistant-Svm3h, main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Patch Kotlin version to 1.9.25
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          python3 scripts/patch-kotlin-version.py
          echo "=== android/build.gradle (first 30 lines) ==="
          head -30 android/build.gradle

      - name: Build APK debug
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
