name: Build Android APK

on:
  push:
    branches: [claude/jarvis-voice-assistant-Svm3h, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Align Kotlin/Compose version (1.9.24)
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          python3 scripts/patch-kotlin-version.py

      - name: Build APK release (JS embutido, instala sem PC)
        run: |
          set -o pipefail
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon 2>&1 | tee /tmp/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Rename APK
        if: success()
        run: cp android/app/build/outputs/apk/release/app-release.apk JARVIS.apk

      - name: Publish Release (download direto do APK)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JARVIS - último APK
          body: |
            APK de release do JARVIS (JavaScript embutido, funciona sem PC).

            **Como instalar:** toque em `JARVIS.apk` abaixo para baixar,
            depois abra o arquivo e permita a instalação de fontes desconhecidas.

            Commit: ${{ github.sha }}
          files: JARVIS.apk
          make_latest: true
